# Test na prawdziwym Windows: cargo test, skan C:\ porównany z zajętym miejscem
# z Get-PSDrive C (rozbieżność ponad 3% = błąd, obie liczby w logu), czas skanu
# (120 s i więcej = błąd) i reguły porządków.
name: test-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Atrapa dist (okno nie jest tu potrzebne)
        run: New-Item -ItemType Directory -Force ../dist | Out-Null; Set-Content ../dist/index.html '<!doctype html>'
      - name: cargo test
        run: cargo test --release
      - name: Skan C:\ kontra Get-PSDrive
        run: |
          cargo build --release --bin luzik-cli
          $env:LUZIK_DIAG = '1'
          $w = & ./target/release/luzik-cli.exe skanuj 'C:\' | ConvertFrom-Json
          "Twarde linki pominiete: {0}" -f $w.twarde_linki_pominiete
          $w2 = & ./target/release/luzik-cli.exe skanuj 'C:\' | ConvertFrom-Json
          "Drugi skan (dysk juz w pamieci systemu): {0:F1} s" -f ([double]$w2.czas_ms / 1000)
          $d = Get-PSDrive C
          $zajete = [double]$d.Used
          $luzik = [double]$w.na_dysku
          $roznica = [math]::Abs($luzik - $zajete) / $zajete * 100
          "Luzik na dysku: {0:N0} B, pliki {1}, katalogi {2}, bledy {3}, czas {4} ms" -f $luzik, $w.pliki, $w.katalogi, $w.bledy_razem, $w.czas_ms
          "Get-PSDrive C zajete: {0:N0} B" -f $zajete
          "Rozbieznosc: {0:F2}%" -f $roznica
          $sekundy = [double]$w.czas_ms / 1000
          "Czas skanu C:\: {0:F1} s ({1:N0} plikow/s)" -f $sekundy, ($w.pliki / [math]::Max($sekundy, 0.001))
          if ($roznica -gt 3) { throw "Rozbieznosc ponad 3%" }
          if ($sekundy -ge 120) { throw "Skan C:\ trwal $sekundy s (prog 120 s)" }
      - name: Porzadki
        run: ./target/release/luzik-cli.exe porzadki
