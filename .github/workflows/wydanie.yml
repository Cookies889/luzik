# Wydanie: tag v* buduje Luzika na Windows (instalator NSIS po polsku), podpisuje paczkę
# aktualizacji kluczem z sekretu TAURI_SIGNING_PRIVATE_KEY i publikuje Release z latest.json.
# Aplikacja co 6 h pyta https://github.com/Cookies889/luzik/releases/latest/download/latest.json
name: wydanie

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Lista zmian dla znajomego bierze się z ZMIANY.md, nie z treści commita
      # (tam są notatki dla programisty i stopka Co-Authored-By).
      - name: Lista zmian z ZMIANY.md
        id: zmiany
        shell: bash
        run: |
          wersja="${GITHUB_REF_NAME#v}"
          awk -v w="## $wersja" '{ sub(/\r$/, "") } $0 == w { t = 1; next } /^## / { t = 0 } t && NF' ZMIANY.md > zmiany.txt
          if [ ! -s zmiany.txt ]; then echo "::error::ZMIANY.md nie ma punktów dla wersji $wersja"; exit 1; fi
          { echo 'tekst<<KONIEC_ZMIAN'; cat zmiany.txt; echo 'KONIEC_ZMIAN'; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Luzik ${{ github.ref_name }}
          releaseBody: ${{ steps.zmiany.outputs.tekst }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
