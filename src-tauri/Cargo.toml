[package]
name = "luzik"
version = "0.1.2"
description = "Luzik: co zajmuje dysk i co mozna bezpiecznie usunac"
edition = "2021"
default-run = "luzik"

[lib]
name = "luzik_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
blake3 = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

# Zaleznosci bez symboli debugowania: katalog kompilacji kilka razy mniejszy.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
